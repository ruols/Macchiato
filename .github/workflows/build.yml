name: Build

on:
  push:
    branches: [main, feature/keyboard-cleaning]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate minimalist app icon
        run: swift scripts/generate-app-icon.swift

      - name: Build macOS app
        run: |
          xcodebuild \
            -project Macchiato.xcodeproj \
            -scheme Macchiato \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/MacchiatoBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Use a persistent certificate identity for updates. Store the PKCS#12
      # and its password in GitHub Actions Secrets; never commit the private key.
      # Without both Secrets, generate a clearly labeled ad-hoc test build.
      - name: Sign app and bundled helper
        env:
          CERT_P12_BASE64: ${{ secrets.SMALLTOOLS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.SMALLTOOLS_CERT_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.SMALLTOOLS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MacchiatoBuild/Build/Products/Release/Macchiato.app"
          HELPER="$APP/Contents/MacOS/app.macchiato.Macchiato.PowerHelper"
          test -d "$APP"
          test -x "$HELPER"
          if find "$APP/Contents/MacOS" -maxdepth 1 -name '*.debug.dylib' | grep -q .; then
            echo "::error::Release package unexpectedly contains an Xcode debug dylib."
            exit 1
          fi

          if [[ -n "$CERT_P12_BASE64" && -n "$CERT_P12_PASSWORD" && -n "$SIGN_IDENTITY" ]]; then
            echo "Signing with configured persistent certificate."
            KEYCHAIN="$RUNNER_TEMP/smalltools-build.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            printf '%s' "$CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN"
            security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
              -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

            # Apple Development certificates already chain to Apple Root CA.
            # Only self-signed identities need explicit local code-signing trust.
            CERT_PEM="$RUNNER_TEMP/code-signing-cert.pem"
            security find-certificate -a -p "$KEYCHAIN" > "$CERT_PEM"
            test -s "$CERT_PEM"
            CERT_SUBJECT="$(openssl x509 -in "$CERT_PEM" -noout -subject | sed 's/^subject= *//')"
            CERT_ISSUER="$(openssl x509 -in "$CERT_PEM" -noout -issuer | sed 's/^issuer= *//')"
            SIGNING_ANCHOR=" and anchor apple generic"
            if [[ "$CERT_SUBJECT" == "$CERT_ISSUER" ]]; then
              echo "Self-signed identity detected; configuring code-signing-only trust."
              SIGNING_ANCHOR=""
              python3 - "$KEYCHAIN" "$CERT_PEM" <<'PY'
          import subprocess
          import sys

          try:
              subprocess.run(
                  ["sudo", "-n", "security", "add-trusted-cert",
                   "-d", "-r", "trustRoot", "-p", "codeSign",
                   "-k", sys.argv[1], sys.argv[2]],
                  check=True,
                  timeout=45,
              )
          except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
              print(f"::error::Cannot configure self-signed code-signing trust: {error}", flush=True)
              sys.exit(1)
          PY
            else
              echo "CA-issued certificate detected; using trusted system certificate chain."
            fi
            rm -f "$CERT_PEM" "$RUNNER_TEMP/certificate.p12"

            # Resolve the actual leaf SHA-1, whether the Secret holds a name or a hash.
            identities="$(security find-identity -v -p codesigning "$KEYCHAIN")"
            identity_line="$(printf '%s\n' "$identities" | grep -F "$SIGN_IDENTITY" | head -n 1 || true)"
            if [[ -z "$identity_line" ]]; then
              echo "::error::Configured signing identity is unavailable or not trusted."
              echo "Check that all three Secrets belong to the same exported PKCS#12 identity."
              exit 1
            fi
            identity_sha="$(awk '{print $2}' <<< "$identity_line")"
            if [[ ! "$identity_sha" =~ ^[[:xdigit:]]{40}$ ]]; then
              echo "::error::Cannot resolve the SHA-1 fingerprint of the signing identity."
              exit 1
            fi

            # Explicit leaf-bound DR avoids codesign guessing 'certificate root =
            # <development leaf>' on a Personal Team Apple Development identity.
            # Keep the same SHA-1 for main App and privileged helper.
            APP_DR="=designated => identifier \"app.macchiato.Macchiato\"${SIGNING_ANCHOR} and certificate leaf = H\"$identity_sha\""
            HELPER_DR="=designated => identifier \"app.macchiato.Macchiato.PowerHelper\"${SIGNING_ANCHOR} and certificate leaf = H\"$identity_sha\""
            for dylib in "$APP"/Contents/MacOS/*.dylib; do
              if test -f "$dylib"; then
                codesign --force --options runtime --timestamp=none \
                  --sign "$identity_sha" --keychain "$KEYCHAIN" "$dylib"
              fi
            done
            codesign --force --options runtime --timestamp=none \
              --identifier "app.macchiato.Macchiato.PowerHelper" \
              --requirements "$HELPER_DR" \
              --sign "$identity_sha" --keychain "$KEYCHAIN" "$HELPER"
            codesign --verify --strict --verbose=2 "$HELPER"
            codesign --force --options runtime --timestamp=none \
              --identifier "app.macchiato.Macchiato" \
              --requirements "$APP_DR" \
              --sign "$identity_sha" --keychain "$KEYCHAIN" "$APP"
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority=|TeamIdentifier=' || true
          elif [[ -z "$CERT_P12_BASE64" && -z "$CERT_P12_PASSWORD" && -z "$SIGN_IDENTITY" ]]; then
            echo "::warning::No persistent signing certificate. Ad-hoc builds may lose Accessibility permission after updates."
            for dylib in "$APP"/Contents/MacOS/*.dylib; do
              if test -f "$dylib"; then
                codesign --force --sign - "$dylib"
              fi
            done
            codesign --force --sign - "$HELPER"
            codesign --force --sign - "$APP"
          else
            echo "::error::Incomplete signing Secrets. Set all three SMALLTOOLS_CERT_P12_BASE64, SMALLTOOLS_CERT_P12_PASSWORD and SMALLTOOLS_SIGN_IDENTITY."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Release distributions must not retain the debug get-task-allow entitlement.
          if codesign -d --entitlements - "$APP" 2>/dev/null | grep -q 'com.apple.security.get-task-allow'; then
            echo "::error::Distribution app contains debug get-task-allow entitlement."
            exit 1
          fi

      - name: Package downloadable app and DMG
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MacchiatoBuild/Build/Products/Release/Macchiato.app"
          mkdir -p dist "$RUNNER_TEMP/MacchiatoDMG"
          ditto "$APP" "dist/小工具.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/小工具.app" "dist/小工具-macos.zip"
          ditto "dist/小工具.app" "$RUNNER_TEMP/MacchiatoDMG/小工具.app"
          ln -s /Applications "$RUNNER_TEMP/MacchiatoDMG/Applications"
          hdiutil create -volname "小工具" -srcfolder "$RUNNER_TEMP/MacchiatoDMG" -ov -format UDZO "dist/小工具.dmg"
          hdiutil verify "dist/小工具.dmg"
          rm -rf "dist/小工具.app"
          cat > dist/READ-ME-FIRST.txt <<'EOF'
          小工具 v1.1.4 (6) - LOCAL TEST BUILD
          Minimum macOS version: 14.0.

          This build is NOT Apple notarized or suitable for general distribution.
          When signing Secrets are configured, it uses the imported identity
          (e.g. Apple Development for local testing), otherwise ad-hoc signing.
          macOS Gatekeeper may require you to approve the app through
          System Settings > Privacy & Security > Open Anyway.

          Keyboard Cleaning requests Accessibility permission and automatically unlocks
          after 60 seconds. Mouse and trackpad input remain available.

          IMPORTANT: Keep Awake relies on a privileged SMAppService LaunchDaemon helper.
          The helper still requires macOS service-management approval.
          Apple Development was verified locally, but updates may need daemon
          re-registration; self-signed signing does not guarantee daemon launch.
          Neither method replaces Developer ID signing or Apple notarization.
          EOF

      - name: Upload installable test app
        uses: actions/upload-artifact@v4
        with:
          name: SmallTools-macOS-App
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish tagged prerelease
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmallTools-macOS-App
          path: dist
      - name: Publish new tag (never overwrite an existing Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test -f "dist/小工具.dmg"
          test -f "dist/小工具-macos.zip"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag exists. Never overwrite a published version."
            exit 1
          fi
          cp "dist/小工具.dmg" "dist/SmallTools-${tag}-macOS.dmg"
          cp "dist/小工具-macos.zip" "dist/SmallTools-${tag}-macOS.zip"
          gh release create "$tag" \
            "dist/SmallTools-${tag}-macOS.dmg" \
            "dist/SmallTools-${tag}-macOS.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "小工具 ${tag}" \
            --generate-notes \
            --prerelease

  # One-time backfill of binary PNG sources after updating the icon generator.
  # This job will be removed once the ten generated assets are committed.
  update_generated_icon:
    name: Commit regenerated app icon PNGs
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/keyboard-cleaning'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate all AppIcon assets
        run: swift scripts/generate-app-icon.swift
      - name: Commit generated PNGs once
        run: |
          set -euo pipefail
          git add Macchiato/Assets.xcassets/AppIcon.appiconset/*.png
          if git diff --cached --quiet; then
            echo "All AppIcon PNGs already match the generator."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'assets: regenerate SmallTools heart-toolbox AppIcon PNGs'
          git push origin HEAD:feature/keyboard-cleaning
