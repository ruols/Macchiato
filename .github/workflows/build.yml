name: Build

on:
  push:
    branches: [main, feature/keyboard-cleaning]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate minimalist app icon
        run: swift scripts/generate-app-icon.swift

      - name: Build macOS app
        run: |
          xcodebuild \
            -project Macchiato.xcodeproj \
            -scheme Macchiato \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/MacchiatoBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Use a persistent certificate identity for updates. Store the PKCS#12
      # and its password in GitHub Actions Secrets; never commit the private key.
      # Without both Secrets, generate a clearly labeled ad-hoc test build.
      - name: Sign app and bundled helper
        env:
          CERT_P12_BASE64: ${{ secrets.SMALLTOOLS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.SMALLTOOLS_CERT_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.SMALLTOOLS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MacchiatoBuild/Build/Products/Debug/Macchiato.app"
          HELPER="$APP/Contents/MacOS/app.macchiato.Macchiato.PowerHelper"
          test -d "$APP"
          test -x "$HELPER"

          if [[ -n "$CERT_P12_BASE64" && -n "$CERT_P12_PASSWORD" && -n "$SIGN_IDENTITY" ]]; then
            echo "Signing with configured persistent certificate."
            KEYCHAIN="$RUNNER_TEMP/smalltools-build.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            printf '%s' "$CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN"
            security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
              -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

            # The runner uses an isolated temporary keychain: import the owner's
            # self-signed root with trust restricted to the code-signing policy.
            security find-certificate -a -p "$KEYCHAIN" > "$RUNNER_TEMP/code-signing-cert.pem"
            test -s "$RUNNER_TEMP/code-signing-cert.pem"
            # Trust settings in unattended macOS runners require admin scope.
            # Restrict this to the codeSign policy; never trust SSL/email use.
            # A hard timeout prevents an authorization dialog hanging CI forever.
            python3 - "$KEYCHAIN" "$RUNNER_TEMP/code-signing-cert.pem" <<'PY'
          import subprocess
          import sys

          try:
              subprocess.run(
                  ["sudo", "-n", "security", "add-trusted-cert",
                   "-d", "-r", "trustRoot", "-p", "codeSign",
                   "-k", sys.argv[1], sys.argv[2]],
                  check=True,
                  timeout=45,
              )
          except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
              print(f"::error::Cannot configure self-signed code-signing trust: {error}", flush=True)
              sys.exit(1)
          PY
            rm -f "$RUNNER_TEMP/code-signing-cert.pem" "$RUNNER_TEMP/certificate.p12"

            # Explain any identity mismatch rather than failing an opaque grep.
            identities="$(security find-identity -v -p codesigning "$KEYCHAIN")"
            if ! printf '%s\\n' "$identities" | grep -Fq "$SIGN_IDENTITY"; then
              echo "$identities"
              echo "::error::Expected signing identity is not trusted or doesn't match SMALLTOOLS_SIGN_IDENTITY."
              exit 1
            fi
            for dylib in "$APP"/Contents/MacOS/*.dylib; do
              if test -f "$dylib"; then
                codesign --force --options runtime --timestamp=none \
                  --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN" "$dylib"
              fi
            done
            codesign --force --options runtime --timestamp=none \
              --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN" "$HELPER"
            codesign --force --options runtime --timestamp=none \
              --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN" "$APP"
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority=|TeamIdentifier=' || true
          elif [[ -z "$CERT_P12_BASE64" && -z "$CERT_P12_PASSWORD" && -z "$SIGN_IDENTITY" ]]; then
            echo "::warning::No persistent signing certificate. Ad-hoc builds may lose Accessibility permission after updates."
            for dylib in "$APP"/Contents/MacOS/*.dylib; do
              if test -f "$dylib"; then
                codesign --force --sign - "$dylib"
              fi
            done
            codesign --force --sign - "$HELPER"
            codesign --force --sign - "$APP"
          else
            echo "::error::Incomplete signing Secrets. Set all three SMALLTOOLS_CERT_P12_BASE64, SMALLTOOLS_CERT_P12_PASSWORD and SMALLTOOLS_SIGN_IDENTITY."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package downloadable app and DMG
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MacchiatoBuild/Build/Products/Debug/Macchiato.app"
          mkdir -p dist "$RUNNER_TEMP/MacchiatoDMG"
          ditto "$APP" "dist/小工具.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/小工具.app" "dist/小工具-macos.zip"
          ditto "dist/小工具.app" "$RUNNER_TEMP/MacchiatoDMG/小工具.app"
          ln -s /Applications "$RUNNER_TEMP/MacchiatoDMG/Applications"
          hdiutil create -volname "小工具" -srcfolder "$RUNNER_TEMP/MacchiatoDMG" -ov -format UDZO "dist/小工具.dmg"
          hdiutil verify "dist/小工具.dmg"
          rm -rf "dist/小工具.app"
          cat > dist/READ-ME-FIRST.txt <<'EOF'
          小工具 v1.1.1 (3) - TEST BUILD
          Minimum macOS version: 14.0.

          This is an ad-hoc signed test build, not a Developer ID signed or notarized release.
          macOS Gatekeeper may require you to approve the app through
          System Settings > Privacy & Security > Open Anyway.

          Keyboard Cleaning requests Accessibility permission and automatically unlocks
          after 60 seconds. Mouse and trackpad input remain available.

          IMPORTANT: Keep Awake relies on a privileged SMAppService LaunchDaemon helper.
          Ad-hoc signing may prevent macOS from registering this helper, so
          system-wide / lid-closed sleep prevention is NOT guaranteed in this test build.
          A properly signed release requires a Developer ID certificate.
          EOF

      - name: Upload installable test app
        uses: actions/upload-artifact@v4
        with:
          name: SmallTools-macOS-App
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish tagged prerelease
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmallTools-macOS-App
          path: dist
      - name: Publish new tag (never overwrite an existing Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test -f "dist/小工具.dmg"
          test -f "dist/小工具-macos.zip"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag exists. Never overwrite a published version."
            exit 1
          fi
          cp "dist/小工具.dmg" "dist/SmallTools-${tag}-macOS.dmg"
          cp "dist/小工具-macos.zip" "dist/SmallTools-${tag}-macOS.zip"
          gh release create "$tag" \
            "dist/SmallTools-${tag}-macOS.dmg" \
            "dist/SmallTools-${tag}-macOS.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "小工具 ${tag}" \
            --generate-notes \
            --prerelease
