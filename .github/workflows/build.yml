name: Build

on:
  push:
    branches: [main, feature/keyboard-cleaning]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate minimalist app icon
        run: swift scripts/generate-app-icon.swift

      - name: Build macOS app
        run: |
          xcodebuild \
            -project Macchiato.xcodeproj \
            -scheme Macchiato \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/MacchiatoBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Developer ID signing / notarization requires the owner's certificate.
      # This ad-hoc signed build is provided only for local testing.
      - name: Ad-hoc sign test app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MacchiatoBuild/Build/Products/Debug/Macchiato.app"
          HELPER="$APP/Contents/MacOS/app.macchiato.Macchiato.PowerHelper"
          test -d "$APP"
          test -x "$HELPER"
          # Xcode Debug builds embed multiple dylibs, including
          # Macchiato.debug.dylib and __preview.dylib.
          # Sign all embedded dylibs before sealing the outer app.
          for dylib in "$APP"/Contents/MacOS/*.dylib; do
            if test -f "$dylib"; then
              codesign --force --sign - "$dylib"
            fi
          done
          codesign --force --sign - "$HELPER"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package downloadable app and DMG
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MacchiatoBuild/Build/Products/Debug/Macchiato.app"
          mkdir -p dist "$RUNNER_TEMP/MacchiatoDMG"
          ditto "$APP" "dist/小工具.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/小工具.app" "dist/小工具-macos.zip"
          ditto "dist/小工具.app" "$RUNNER_TEMP/MacchiatoDMG/小工具.app"
          ln -s /Applications "$RUNNER_TEMP/MacchiatoDMG/Applications"
          hdiutil create -volname "小工具" -srcfolder "$RUNNER_TEMP/MacchiatoDMG" -ov -format UDZO "dist/小工具.dmg"
          hdiutil verify "dist/小工具.dmg"
          rm -rf "dist/小工具.app"
          cat > dist/READ-ME-FIRST.txt <<'EOF'
          小工具 v1.1.0 (2) - TEST BUILD
          Minimum macOS version: 14.0.

          This is an ad-hoc signed test build, not a Developer ID signed or notarized release.
          macOS Gatekeeper may require you to approve the app through
          System Settings > Privacy & Security > Open Anyway.

          Keyboard Cleaning requests Accessibility permission and automatically unlocks
          after 60 seconds. Mouse and trackpad input remain available.

          IMPORTANT: Keep Awake relies on a privileged SMAppService LaunchDaemon helper.
          Ad-hoc signing may prevent macOS from registering this helper, so
          system-wide / lid-closed sleep prevention is NOT guaranteed in this test build.
          A properly signed release requires a Developer ID certificate.
          EOF

      - name: Upload installable test app
        uses: actions/upload-artifact@v4
        with:
          name: SmallTools-macOS-App
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish v1.1.0 prerelease
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/keyboard-cleaning'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmallTools-macOS-App
          path: dist
      - name: Publish signed-test release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f "dist/小工具.dmg"
          test -f "dist/小工具-macos.zip"
          # GitHub sanitizes non-ASCII Release asset names. Keep the app's
          # localized name inside the package, but publish ASCII file names.
          cp "dist/小工具.dmg" "dist/SmallTools-v1.1.0-macOS.dmg"
          cp "dist/小工具-macos.zip" "dist/SmallTools-v1.1.0-macOS.zip"

          if gh release view "v1.1.0" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release view "v1.1.0" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                 grep -Fxq "SmallTools-v1.1.0-macOS.dmg"; then
              gh release upload "v1.1.0" \
                "dist/SmallTools-v1.1.0-macOS.dmg" \
                "dist/SmallTools-v1.1.0-macOS.zip" \
                --repo "$GITHUB_REPOSITORY"
            fi
            gh release edit "v1.1.0" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
            # Remove only the misnamed files after the replacements uploaded.
            for old_asset in "default.dmg" "-macos.zip"; do
              if gh release view "v1.1.0" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                   grep -Fxq -- "$old_asset"; then
                gh release delete-asset "v1.1.0" --repo "$GITHUB_REPOSITORY" --yes -- "$old_asset"
              fi
            done
          else
            gh release create "v1.1.0" \
              "dist/SmallTools-v1.1.0-macOS.dmg" \
              "dist/SmallTools-v1.1.0-macOS.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "小工具 v1.1.0 (2)" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
